{% load static %}
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Quản lý chăn nuôi{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <a class="skip-link" href="#main-content">Đến nội dung chính</a>
    <header class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top shadow-sm">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}"><span class="brand-mark" aria-hidden="true">N</span> Nông trại AI</a>
        <div class="d-flex align-items-center gap-3 text-white">
          {% if user.is_authenticated %}
            <span class="small d-none d-sm-inline">{{ user.username }}{% if nav_role %} · {{ nav_role }}{% endif %}</span>
            <form method="post" action="{% url 'logout' %}" class="m-0">
              {% csrf_token %}
              <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
          {% endif %}
        </div>
      </div>
    </header>
    {% block body %}{% endblock %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
