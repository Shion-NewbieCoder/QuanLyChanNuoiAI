<div class="page-heading">
  <div><p class="eyebrow">Quản lý nông trại</p><h1>{{ resource.title }}</h1>{% if resource.hint %}<p class="text-secondary mb-0">{{ resource.hint }}</p>{% endif %}</div>
  {% if action == "list" and can_create %}<a class="btn btn-success" href="{{ resource.url }}create/">+ Thêm bản ghi</a>{% endif %}
</div>
{% if resource.section == "vaccines" %}
<nav class="section-tabs" aria-label="Quản lý vaccine"><a {% if resource.slug == "vaccines" %}aria-current="page"{% endif %} href="{% url 'ui-vaccines-list' %}">Lịch vaccine</a><a {% if resource.slug == "vaccination-records" %}aria-current="page"{% endif %} href="{% url 'ui-vaccination-records-list' %}">Lần tiêm đã ghi nhận</a></nav>
{% endif %}
